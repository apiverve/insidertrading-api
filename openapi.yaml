openapi: 3.0.4
info:
  title: Insider Trading
  description: >-
    Insider Trading returns recent SEC Form 4 insider transactions for a US
    public company by ticker - who bought or sold, their role, the number of
    shares, price and transaction type - plus a derived insider-sentiment
    summary with net buy/sell activity and cluster-buy detection calculated for
    you.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/insidertrading:
    get:
      summary: Insider Trading
      description: >-
        Get recent SEC Form 4 insider transactions for a company by ticker
        symbol. Optionally filter to buys or sells and limit the number of
        transactions returned.
      operationId: insidertrading
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: AAPL
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: Filter to open-market buys or sells (buy or sell).
          example: buy
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Number of transactions to return (1-25). Defaults to 5.
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  cik: '0000320193'
                  company: Apple Inc.
                  totalRecentForm4: 512
                  count: 5
                  lastTransactionDate: '2025-10-14'
                  daysSinceLastTransaction: 64
                  transactions:
                    - filingDate: '2025-10-16'
                      transactionDate: '2025-10-14'
                      insiderName: COOK TIMOTHY D
